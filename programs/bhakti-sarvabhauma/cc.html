<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caitanya-caritāmṛta — Bhakti Study</title><link rel="stylesheet" href="../../shared/styles.css"><style>.cc-grid{display:grid;grid-template-columns:280px 1fr;gap:20px}.lila-menu,.chapter-menu,.verse-menu{display:flex;gap:7px;flex-wrap:wrap}.lila-menu button,.chapter-menu button,.verse-menu button{border:1px solid #d8d0c2;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.lila-menu button.active,.chapter-menu button.active,.verse-menu button.active{font-weight:700;border-color:#f59e0b}.verse-card{max-width:900px}.verse-card h3{margin-top:1.5rem}.scripture{white-space:pre-line;font-size:1.12rem;line-height:1.8}.source-text{white-space:pre-line;line-height:1.75}.cc-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin:12px 0}.missing{padding:12px;background:#fff4df;border-radius:8px}.reader-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:850px){.cc-grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="../../shared/reader-navigation.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Bhakti Sārvabhauma · Internal Primary Source</div><h1>Śrī Caitanya-caritāmṛta</h1><p class="lead">Self-contained Academy reader for Ādi-līlā, Madhya-līlā, and Antya-līlā.</p><div class="card"><div id="lilas" class="lila-menu"></div><div id="chapters" class="chapter-menu" style="margin-top:10px"></div></div><div class="cc-grid"><section class="card"><h2 id="chapterTitle">Chapter</h2><div id="verses" class="verse-menu"></div></section><section><div id="status" class="card">Loading internal Caitanya-caritāmṛta…</div><article id="passage" class="card verse-card" hidden></article></section></div></main></div><script src="../../shared/app.js"></script><script src="../../shared/student-store.js"></script><script src="../../shared/highlighter.js"></script><script src="../../shared/voice-input.js"></script><script>
sidebar('bhakti-sarvabhauma');
const $=id=>document.getElementById(id),cleanText=s=>String(s??'').replace(/\\n/g,'\n'),esc=s=>cleanText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L={adi:{label:'Ādi-līlā',book:'cc-adi',unit:'BSARV.U1'},madhya:{label:'Madhya-līlā',book:'cc-madhya',unit:'BSARV.U2'},antya:{label:'Antya-līlā',book:'cc-antya',unit:'BSARV.U3'}};let data,currentLila='adi',currentChapter=1,currentVerse=1;
function canonical(l,ch,v){return `CC.${l.toUpperCase()}.${ch}.${v}`}
function refRange(r){const m=String(r.reference||'').match(/^(adi|madhya|antya)\.(\d+)\.(\d+)(?:-(\d+))?$/i);return m?{l:m[1].toLowerCase(),ch:+m[2],a:+m[3],b:+(m[4]||m[3])}:null}
function chapterFor(l,ch){return data[l]?.chapters.find(x=>x.chapter===ch)||null}
function recordFor(l,ch,v){const cc=chapterFor(l,ch);return cc?.verses.find(r=>{const x=refRange(r);return x&&x.l===l&&x.ch===ch&&v>=x.a&&v<=x.b})||null}
function verseMax(l,ch){const cc=chapterFor(l,ch);return Math.max(0,...(cc?.verses||[]).map(r=>{const x=refRange(r);return x?x.b:0}))}
function renderLilas(){lilas.innerHTML=Object.entries(L).map(([k,x])=>`<button data-l="${k}" class="${k===currentLila?'active':''}">${x.label}</button>`).join('');lilas.onclick=e=>{const b=e.target.closest('[data-l]');if(b)open(b.dataset.l,1,1)}}
function renderChapters(l){chapters.innerHTML=(data[l]?.chapters||[]).map(x=>`<button data-ch="${x.chapter}" class="${x.chapter===currentChapter?'active':''}">Chapter ${x.chapter}</button>`).join('');chapters.onclick=e=>{const b=e.target.closest('[data-ch]');if(b)open(l,+b.dataset.ch,1)}}
function renderVerseMenu(l,ch){const cc=chapterFor(l,ch);chapterTitle.textContent=cc?.title||`Chapter ${ch}`;const max=verseMax(l,ch);verses.innerHTML=Array.from({length:max},(_,i)=>i+1).map(v=>`<button data-v="${v}" class="${v===currentVerse?'active':''}">${v}</button>`).join('');verses.onclick=e=>{const b=e.target.closest('[data-v]');if(b)open(l,ch,+b.dataset.v)}}
function adjacent(l,ch,v,d){const keys=['adi','madhya','antya'];let li=keys.indexOf(l),H=ch,V=v+d;while(li>=0&&li<keys.length){const k=keys[li],chs=data[k].chapters;while(H>=1&&H<=chs.length){const max=verseMax(k,H);if(V>=1&&V<=max)return[k,H,V];if(d>0){H++;V=1}else{H--;if(H>=1)V=verseMax(k,H)}}if(d>0){li++;H=1;V=1}else{li--;if(li>=0){H=data[keys[li]].chapters.length;V=verseMax(keys[li],H)}}}return null}
function open(l,ch,v){currentLila=l;currentChapter=ch;currentVerse=v;renderLilas();renderChapters(l);renderVerseMenu(l,ch);const r=recordFor(l,ch,v),ref=canonical(l,ch,v),meta=L[l];status.hidden=true;passage.hidden=false;if(!r){passage.innerHTML=`<div class="missing"><strong>${ref}</strong> is not mapped in the internal canonical Caitanya-caritāmṛta source.</div>`;return}const prev=adjacent(l,ch,v,-1),next=adjacent(l,ch,v,1),rr=refRange(r),ved=`https://vedabase.io/en/library/cc/${l.toLowerCase()}/${ch}/${v}/`,vani=`https://vanipedia.org/wiki/ES/CC_${l.charAt(0).toUpperCase()+l.slice(1)}_${ch}.${v}`;passage.innerHTML=`<div class="cc-nav"><span>${prev?`<button id="prev" class="button secondary">← ${canonical(...prev)}</button>`:''}</span><span><a class="button secondary" href="index.html#${meta.unit}">Back to ${meta.label}</a> <a class="button secondary" href="index.html">Bhakti Sārvabhauma</a> <a class="button secondary" href="../../index.html">Academy Home</a></span><span>${next?`<button id="next" class="button secondary">${canonical(...next)} →</button>`:''}</span></div><div class="eyebrow">Internal Academy Source</div><h2>${ref}${rr&&rr.a!==rr.b?` <span class="small muted">(source record ${esc(r.reference)})</span>`:''}</h2><div class="reader-actions" style="margin:10px 0 18px"><a class="button lotus" href="tools.html?unit=${encodeURIComponent(meta.unit)}&mode=understanding&ref=${encodeURIComponent(ref)}">Study</a><a class="button secondary" href="${ved}" target="_blank" rel="noopener">Vedabase ↗</a><a class="button secondary" href="${vani}" target="_blank" rel="noopener">Vanipedia ↗</a></div><h3>Source Text</h3><div class="scripture">${esc(r.devanagari||'')}</div><h3>Roman Transliteration</h3><div class="scripture">${esc(r.transliteration||'')}</div><h3>Word-for-word</h3><div class="source-text">${esc(r.synonyms||'').replace(/\n/g,' ')}</div><h3>Translation</h3><div class="source-text">${esc(r.translation||'')}</div>${r.purport?`<h3>Purport / Commentary</h3><div class="source-text">${esc(r.purport).replace(/\n/g,' ')}</div>`:`<div class="missing"><strong>Commentary:</strong> this source record contains no commentary text. Nothing has been fabricated.</div>`}`;if(window.AcademyHighlighter)AcademyHighlighter.attach(passage,ref);document.getElementById('prev')?.addEventListener('click',()=>open(...prev));document.getElementById('next')?.addEventListener('click',()=>open(...next));history.replaceState(null,'',`cc.html?ref=${encodeURIComponent(ref)}&unit=${meta.unit}`);window.scrollTo({top:0,behavior:'instant'})}
Promise.all(Object.entries(L).map(([k,x])=>fetch(`../../library/books/${x.book}/book.json`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`${x.label}: HTTP ${r.status}`);return r.json()}).then(d=>[k,d]))).then(rows=>{data={};for(const[k,d]of rows){data[k]={chapters:(d.sections||[]).filter(s=>(s.verses||[]).some(v=>new RegExp(`^${k}\\.\\d+\\.`,'i').test(v.reference||''))).map(section=>{const x=refRange(section.verses.find(v=>refRange(v))||{});return{chapter:x.ch,title:section.title,verses:section.verses||[]}})}}const q=new URLSearchParams(location.search),m=(q.get('ref')||'CC.ADI.1.1').match(/^CC[. ](ADI|MADHYA|ANTYA)[. ](\d+)[. ](\d+)(?:-(\d+))?$/i);const l=m?m[1].toLowerCase():'adi',ch=m?+m[2]:1,v=m?+m[3]:1;if(!chapterFor(l,ch))throw Error('This reader supports Caitanya-caritāmṛta Ādi, Madhya, and Antya līlās.');open(l,ch,v)}).catch(e=>{status.textContent='Unable to load internal Caitanya-caritāmṛta data: '+e.message});
</script><script src="../../shared/reader-navigation.js"></script></body></html>
