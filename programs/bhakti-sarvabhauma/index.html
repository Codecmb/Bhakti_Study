<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bhakti Sārvabhauma</title><link rel="stylesheet" href="../../shared/styles.css"><style>.muted{opacity:.75}.unit{padding:1rem;border:1px solid #ddd;border-radius:12px;margin:.6rem 0}.badge{font-size:.8rem;padding:.2rem .5rem;border:1px solid #aaa;border-radius:999px}</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Study Program</div><h1>Bhakti Sārvabhauma</h1><p class="lead">Śrī Caitanya-caritāmṛta · Ādi · Madhya · Antya</p><div id="summary"></div><h2>Study Units</h2><div id="units"></div><h2>Assessment Framework</h2><div id="assessment"></div><p class="small"><strong>Certificate:</strong> Academy completion certificate only unless separately issued through an authorized BOEX center.</p></main></div><script src="../../shared/app.js"></script><script src="../../shared/data-registry.js"></script><script src="../../shared/program-data.js"></script><script src="../../shared/study-workflow.js"></script><script>BhaktiProgramData.loadCourse('data/').then(c=>{summary.innerHTML=`<p><span class="badge">${c.books?.length||3} Līlās</span> <span class="badge">${c.units?.length||0} study units</span></p>`;units.innerHTML=(c.units||[]).map(u=>`<div class="unit"><strong>${u.title}</strong><div class="muted">${u.range||''}</div><div style="margin-top:.65rem;display:flex;gap:.4rem;flex-wrap:wrap">${StudyWorkflow.buttons(c,{program:'bhakti-sarvabhauma',unit:u.id})}</div></div>`).join('');const a=c.assessment?.officialFramework||c.assessment||{};assessment.innerHTML=`<p>${a.description||'Official framework information is preserved separately from Academy completion rules.'}</p>`}).catch(e=>{units.innerHTML=`<div class="notice">Unable to load program data: ${e.message}</div>`})</script></body></html>
