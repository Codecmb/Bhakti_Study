<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Bhakti Vaibhava — Academy Study Guides</title>
<link rel="stylesheet" href="../../shared/styles.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="study-nav">
      <a class="button secondary" href="javascript:history.back()">← Back</a>
      <a class="button secondary" href="index.html">↑ Bhakti Vaibhava</a>
      <a class="button secondary" href="../../index.html">🏠 Academy Home</a>
    </div>

    <div class="eyebrow">Bhakti Vaibhava</div>
    <h1>Academy Study Guides</h1>
    <p class="lead">
      Supplementary guides and questions added by the Academy.
      These remain separate from canonical scripture and official Ministry/BOEX question banks.
    </p>

    <div id="guides"></div>
  </main>
</div>

<script src="../../shared/app.js"></script>
<script src="../../shared/academy-guides.js"></script>
<script>
const PROGRAM='bhakti-vaibhava';
sidebar(PROGRAM);

const esc=s=>String(s??'').replace(
  /[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
);

const guides=AcademyGuides.forProgram(PROGRAM);
const host=document.getElementById('guides');

if(!guides.length){
  host.innerHTML='<div class="notice">No Academy Study Guides have been published for this program yet.</div>';
}else{
  host.innerHTML=guides.map(g=>`
    <article class="card">
      <span class="tag">${esc(g.provenance||'Academy Study Guide')}</span>
      <h2>${esc(g.title)}</h2>
      ${g.scope?`<p class="small">${esc(g.scope)}</p>`:''}

      ${g.body?`
        <details>
          <summary><b>Read Study Guide</b></summary>
          <div style="white-space:pre-wrap;line-height:1.65;margin-top:12px">${esc(g.body)}</div>
        </details>
      `:''}

      ${g.questions?.length?`
        <h3>Questions</h3>
        ${g.questions.map(q=>`
          <div class="question-card">
            <b>${esc(q.text)}</b>
            <textarea class="field" placeholder="Your answer..."></textarea>
            <div class="action-grid">
              ${(q.refs||[]).map(r=>
                `<a class="button secondary" href="${AcademyGuides.internalHref(r,PROGRAM)}">Study ${esc(r)}</a>`
              ).join('')}
            </div>
          </div>
        `).join('')}
      `:''}
    </article>
  `).join('');
}
</script>
</body>
</html>
