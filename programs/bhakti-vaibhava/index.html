<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bhakti Vaibhava</title><link rel="stylesheet" href="../../shared/styles.css"><style>.muted{opacity:.75}.unit{padding:1rem;border:1px solid #ddd;border-radius:12px;margin:.6rem 0}.badge{font-size:.8rem;padding:.2rem .5rem;border:1px solid #aaa;border-radius:999px}</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Study Program</div><h1>Bhakti Vaibhava</h1><p class="lead">Śrīmad-Bhāgavatam Cantos 1–6 · source-first Academy study track</p><div id="summary"></div><h2>Study Units</h2><div id="units"></div><h2>Śloka Integration</h2><p id="slokas"></p><p class="muted">Verse text/audio/memorization remain owned by the separate Śrīla Prabhupāda Ślokas app; this course stores references only.</p><h2>Official Resources</h2><div id="resources"></div></main></div><script src="../../shared/app.js"></script><script src="../../shared/data-registry.js"></script><script src="../../shared/program-data.js"></script><script src="../../shared/study-workflow.js"></script><script>Promise.all([BhaktiProgramData.loadCourse('data/'),fetch('data/slokas.json').then(r=>r.json()),fetch('data/official-resources.json').then(r=>r.json())]).then(([c,s,r])=>{summary.innerHTML=`<p><span class="badge">${c.books.length} Cantos</span> <span class="badge">${c.units.length} units</span> <span class="badge">≤ ${c.assessment.officialFramework.maxChaptersPerUnit} chapters/unit</span></p>`;units.innerHTML=c.units.map(u=>`<div class="unit"><strong>${u.title}</strong><div class="muted">${u.range}</div><div style="margin-top:.65rem;display:flex;gap:.4rem;flex-wrap:wrap">${StudyWorkflow.buttons(c,{program:'bhakti-vaibhava',unit:u.id})}</div></div>`).join('');slokas.textContent=`${s.officialPublicReferenceCount} publicly enumerated Ministry references are mapped now; the official standard requires at least ${s.minimumRequiredByStandard}. Additional selections remain configurable until sourced.`;resources.innerHTML=r.official.map(x=>`<p><a href="${x.url}" target="_blank" rel="noopener">${x.title} ↗</a> — ${x.purpose}</p>`).join('')})</script></body></html>
