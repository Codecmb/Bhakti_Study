<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bhakti Vedānta</title><link rel="stylesheet" href="../../shared/styles.css"><style>.unit{padding:1rem;border:1px solid #ddd;border-radius:12px;margin:.6rem 0}.warn{padding:1rem;border:1px solid #b88;border-radius:12px}.muted{opacity:.75}</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Study Program</div><h1>Bhakti Vedānta</h1><p class="lead">Śrīmad-Bhāgavatam Cantos 7–12 · source-first Academy study track</p><div id="warning"></div><h2>Study Units</h2><div id="units"></div><h2>Śloka Integration</h2><p id="slokas"></p><p class="muted">Verse text, audio and memorization remain owned by the separate Śrīla Prabhupāda Ślokas app.</p><h2>Official Resources</h2><div id="resources"></div></main></div><script src="../../shared/app.js"></script><script src="../../shared/data-registry.js"></script><script src="../../shared/program-data.js"></script><script src="../../shared/study-workflow.js"></script><script>Promise.all([BhaktiProgramData.loadCourse('data/'),fetch('data/slokas.json').then(r=>r.json()),fetch('data/official-resources.json').then(r=>r.json())]).then(([c,s,r])=>{warning.innerHTML='<div class="warn"><strong>Source integrity notice:</strong> The supplied Canto 10 source currently contains only 13 registered chapters. It is intentionally marked incomplete until a complete source is supplied/imported.</div>';units.innerHTML=c.units.map(u=>`<div class="unit"><strong>${u.title}</strong><div class="muted">${u.range}</div><div style="margin-top:.65rem;display:flex;gap:.4rem;flex-wrap:wrap">${StudyWorkflow.buttons(c,{program:'bhakti-vedanta',unit:u.id})}</div></div>`).join('');slokas.textContent=`The official standard requires at least ${s.minimumRequiredByStandard} verses from Cantos 7–12. The requirement is configured, but no unsourced official verse list has been invented.`;resources.innerHTML=r.official.map(x=>`<p><a href="${x.url}" target="_blank" rel="noopener">${x.title} ↗</a> — ${x.purpose}</p>`).join('')})</script></body></html>
