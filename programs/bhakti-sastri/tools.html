<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bhakti Śāstrī Study Tool</title><link rel="stylesheet" href="../../shared/styles.css"></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div id="unitNav" class="study-nav"></div><div id="workflowTabs" class="tool-tabs"></div><div class="eyebrow">Study workspace</div><h1 id="heading">Bhakti Śāstrī</h1><p id="sub" class="lead"></p><div id="content" class="card tool-panel"></div></main></div><script src="../../shared/app.js"></script><script src="../../shared/data-registry.js"></script><script src="../../shared/program-data.js"></script><script src="../../shared/study-workflow.js"></script><script src="../../shared/question-provider-data.js"></script><script src="../../shared/question-engine.js"></script><script src="../../shared/question-management-ui.js"></script><script src="../../shared/vendor/jszip/jszip.min.js"></script><script src="../../shared/question-sheet-importer.js"></script><script src="../../shared/student-store.js"></script><script src="../../shared/student-work-draft.js"></script><script src="../../shared/progress-engine.js"></script><script src="../../shared/study-context.js"></script><script src="../../shared/study-return-context.js"></script><script src="../../shared/source-resolver.js"></script><script src="../../shared/student-questions.js"></script><script src="../../shared/internal-source-search.js"></script><script src="../../shared/my-questions-ui.js"></script><script src="../../shared/voice-input.js"></script><script>
sidebar('bhakti-sastri');
(async()=>{const q=new URLSearchParams(location.search),uid=q.get('unit')||'BS.U1',mode=q.get('mode')||'understanding',ref=q.get('ref')||'';const [course,providers]=await Promise.all([BhaktiProgramData.loadCourse('data/'),BhaktiQuestionProviders.loadProviders('data/')]),u=course.units.find(x=>x.id===uid)||course.units[0];const canonical=ref&&SourceResolver?.canon?SourceResolver.canon(ref)||ref:ref;if(!StudyWorkflow.hasMode(course,mode)){location.href=`tools.html?unit=${encodeURIComponent(uid)}&mode=understanding${canonical?'&ref='+encodeURIComponent(canonical):''}`;return}const sourceTarget=canonical?await SourceResolver.resolve(canonical):null;const sourceHref=sourceTarget?.href?sourceTarget.href+((sourceTarget.kind==='internal')?`&program=bhakti-sastri&unit=${encodeURIComponent(uid)}`:''):'';heading.textContent=u.title;sub.textContent='Source-first Academy workspace · '+u.id+(canonical?' · '+canonical:'');workflowTabs.innerHTML=StudyWorkflow.tabs(course,{program:'bhakti-sastri',unit:u.id,canonical,mode});const ix=course.units.findIndex(x=>x.id===u.id),prev=course.units[ix-1],next=course.units[ix+1];unitNav.innerHTML=`${prev?`<a class="button secondary" href="tools.html?unit=${encodeURIComponent(prev.id)}&mode=${mode}">← Back</a>`:'<span></span>'}<a class="button secondary" href="index.html">↑ Program</a>${next?`<a class="button secondary" href="tools.html?unit=${encodeURIComponent(next.id)}&mode=${mode}">Forward →</a>`:'<span></span>'}`;const scope=canonical||uid;const legacyKey='bhakti-study.bs.'+scope+'.'+mode;const studentId=`bhakti-sastri.${scope}.${mode}`;const save=(label='Saved in this browser.')=>{StudentStore.set(mode,studentId,document.querySelector('#entry')?.value||'');document.querySelector('#msg').textContent=label};
if(mode==='read'){const sources=u.sources||((u.books||[u.book]).filter(Boolean).map(book=>({book})));if(canonical){const hit=await SourceResolver.resolve(canonical);if(hit?.kind==='internal'){location.href=hit.href+`&program=bhakti-sastri&unit=${encodeURIComponent(uid)}`;return}}if(sources.length===1&&sources[0].startRef){const src=sources[0];location.href=`../../library/reader.html?book=${encodeURIComponent(src.book)}&ref=${encodeURIComponent(src.startRef)}&program=bhakti-sastri&unit=${encodeURIComponent(uid)}`;return}content.innerHTML='<h2>Choose internal source</h2><p class="small">Academy books are always opened first. External sources are used only when an internal source is unavailable.</p>'+sources.map(src=>`<p><a class="button" href="../../library/reader.html?book=${encodeURIComponent(src.book)}${src.startRef?'&ref='+encodeURIComponent(src.startRef):''}&program=bhakti-sastri&unit=${encodeURIComponent(uid)}">Open ${src.book.toUpperCase()}</a></p>`).join('');return}
if(mode==='understanding'){content.innerHTML=`<h2>My Understanding</h2><p>Write before checking secondary material. Then return to the primary text, reread Śrīla Prabhupāda's translation and purport, and revise your understanding.</p><textarea id="entry" class="field" placeholder="What do I understand from this unit?"></textarea><button id="save" class="button lotus">Save Understanding</button> <button id="clearWork" class="button secondary">Clear</button> <a class="button secondary" href="${sourceHref||('tools.html?unit='+uid+'&mode=read')}"${sourceTarget?.kind==='external'?' target="_blank" rel="noopener"':''}>Study the Sources</a><p id="msg" class="small"></p>`}
else if(mode==='notes'){content.innerHTML=`<h2>Notes</h2><p class="small">Private study notes stored only in this browser.</p><textarea id="entry" class="field" placeholder="Notes, references, questions to revisit…"></textarea><button id="save" class="button">Save Notes</button> <button id="clearWork" class="button secondary">Clear</button>${canonical&&sourceHref?` <a class="button secondary" href="${sourceHref}"${sourceTarget?.kind==='external'?' target="_blank" rel="noopener"':''}>Study ${canonical}${sourceTarget?.kind==='external'?' ↗':''}</a>`:''}<p id="msg" class="small"></p>`}
else {const req=ProgressEngine.requirementState('bhakti-sastri',u,course),assessmentId=req.assessmentId,assessment=req.assessment,requirements=req.requirements;if(!req.config.enabled){content.innerHTML=`<h2>Assessment</h2><div class="notice">Academy completion rules are not configured for this program/unit yet.</div>`;return}content.innerHTML=`<h2>Assessment</h2><div class="notice">Academy self-study assessment. Official BOEX assessment remains a separate process.</div>${requirements.map((r,i)=>`<div class="check-row"><input type="checkbox" id="req${i}" data-requirement="${r.id}" ${r.checked?'checked':''}><label for="req${i}">${r.label}</label></div>`).join('')}<p><button id="saveAssessment" class="button secondary">Save Assessment</button> <button id="mark" class="button saffron">Mark Academy Unit Complete</button></p><p id="msg" class="small"></p>`;const state=()=>Object.fromEntries([...content.querySelectorAll('[data-requirement]')].map(el=>[el.dataset.requirement,el.checked]));saveAssessment.onclick=()=>{StudentStore.setJSON('assessment',assessmentId,state());msg.textContent='Assessment saved in this browser.'};mark.onclick=()=>{const current=state();StudentStore.setJSON('assessment',assessmentId,current);const missing=requirements.filter(r=>!current[r.id]);if(missing.length){msg.textContent=`Complete all ${requirements.length} configured Academy checks before marking this unit complete.`;return}StudentStore.set('completion',assessmentId,'1');msg.textContent='Academy unit marked complete in this browser.'};return}
const entry=document.querySelector('#entry');
if(entry){
  entry.value=StudentStore.migrate(legacyKey,mode,studentId)||'';
  const draft=globalThis.StudentWorkDraft?.attach?.({
    id:mode==='notes'?`notes.${studentId}`:studentId,
    field:entry,
    status:document.querySelector('#msg'),
    onSave:value=>StudentStore.set(mode,studentId,value)
  });
  document.querySelector('#save')?.addEventListener('click',()=>draft?draft.save():save());

  document.querySelector('#clearWork')?.addEventListener('click',()=>{
    if(!globalThis.StudentWorkDraft?.clearWork)return;

    StudentWorkDraft.clearWork({
      id:mode==='notes'?`notes.${studentId}`:studentId,
      field:entry,
      status:document.querySelector('#msg'),
      onClear:()=>StudentStore.remove(mode,studentId),
      message:mode==='notes'
        ? 'Clear these Notes? This cannot be undone.'
        : 'Clear My Understanding? This cannot be undone.'
    });
  });
}
VoiceInput?.attachAll(content);})();
</script></body></html>
