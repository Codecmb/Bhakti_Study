<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academy Health Check</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
.health-header {
  background:#172b54;
  color:white;
  border-bottom:4px solid #bd9850;
  border-radius:14px;
  padding:25px;
  margin-bottom:24px;
}
.health-header h1 { color:white; font-family:Georgia,serif; }
.health-header p { color:#e5dfd3; }
.health-card {
  background:white;
  border:1px solid #e4ddd0;
  border-radius:12px;
  padding:20px;
  margin-bottom:14px;
}
.health-card h2 { font-size:19px; margin-top:0; }
.health-result { margin-top:12px; line-height:1.8; }
.health-ok { color:#17653b; }
.health-error { color:#a32929; }
.health-note { color:#74643e; }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"></aside>
<main class="main">

<header class="health-header">
<h1>Academy Health Check</h1>
<p>Read-only checks for application files and educational content.</p>
</header>


<section class="health-card">
  <h2>Academy Content Inventory</h2>
  <p>Live counts from registered academic curriculum files.</p>
  <button class="button" id="runInventory">Count Educational Content</button>
  <div id="inventoryResults" class="health-result" aria-live="polite"></div>
</section>

<button class="button" id="runCheck">Run Health Check</button>
<p id="summary" aria-live="polite"></p>
<div id="results"></div>

</main>
</div>

<script src="../shared/app.js"></script>
<script>
sidebar('manage');

const checks = [
  ['Academy Home','../index.html'],
  ['Study Classroom','../student/aula-estudio.html'],
  ['Book Study','../student/book-study.html'],
  ['Study Journal','../student/journal.html'],
  ['Question Bank','../question-bank/index.html'],
  ['Books & Library','../library/index.html'],
  ['Bhakti Śāstrī','../programs/bhakti-sastri/index.html'],
  ['Bhakti Vaibhava','../programs/bhakti-vaibhava/index.html'],
  ['Bhakti Vedānta','../programs/bhakti-vedanta/index.html'],
  ['Bhakti Sārvabhauma','../programs/bhakti-sarvabhauma/index.html'],
  ['Ṣaṭ Sandarbhas','../programs/sat-sandarbhas/index.html'],
  ['Tattva Sandarbha','../programs/sat-sandarbhas/tattva/index.html'],
  ['Bhagavat Sandarbha','../programs/sat-sandarbhas/bhagavat/index.html'],
  ['Paramātma Sandarbha','../programs/sat-sandarbhas/paramatma/index.html'],
  ['Kṛṣṇa Sandarbha','../programs/sat-sandarbhas/krsna/index.html'],
  ['Bhakti Sandarbha','../programs/sat-sandarbhas/bhakti/index.html'],
  ['Prīti Sandarbha','../programs/sat-sandarbhas/priti/index.html'],
  ['Program Registry','../data/programs.json'],
  ['Book Registry','../data/books.json']
];

document.getElementById('runCheck').addEventListener('click',async()=>{
  const button=document.getElementById('runCheck');
  const results=document.getElementById('results');
  const summary=document.getElementById('summary');

  button.disabled=true;
  results.replaceChildren();
  summary.textContent='Checking application resources...';

  let passed=0,failed=0;

  for(const [name,path] of checks){
    const card=document.createElement('article');
    card.className='health-card';

    const title=document.createElement('h2');
    title.textContent=name;
    card.appendChild(title);

    const status=document.createElement('div');
    status.className='health-result';

    try {
      const response=await fetch(path,{cache:'no-store'});

      if(!response.ok)throw new Error('HTTP '+response.status);

      if(path.endsWith('.json')){
        await response.json();
      }else{
        const content=await response.text();
        if(!content.trim().toLowerCase().includes('<html')){
          throw new Error('Unexpected HTML response');
        }
      }

      status.className+=' health-ok';
      status.textContent='✓ Resource accessible';
      passed++;
    }catch(error){
      status.className+=' health-error';
      status.textContent='✗ Check failed: '+error.message;
      failed++;
    }

    card.appendChild(status);
    results.appendChild(card);
  }

  summary.textContent=
    'Completed: '+passed+' passed, '+failed+' failed, '+checks.length+' checked. '+
    'This verifies resource accessibility and basic parsing, not full content integrity.';

  button.disabled=false;
});

const inventoryPrograms = [
  ['Bhakti Śāstrī','bhakti-sastri'],
  ['Bhakti Vaibhava','bhakti-vaibhava'],
  ['Bhakti Vedānta','bhakti-vedanta'],
  ['Bhakti Sārvabhauma','bhakti-sarvabhauma']
];

document.getElementById('runInventory').addEventListener('click', async () => {
  const output = document.getElementById('inventoryResults');
  const button = document.getElementById('runInventory');

  button.disabled = true;
  output.replaceChildren();
  output.textContent = 'Reading curriculum files...';

  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;margin-top:15px';

  const head = document.createElement('tr');

  for (const label of ['Program','Lessons','Units','Supplemental Sessions']) {
    const th = document.createElement('th');
    th.textContent = label;
    th.style.cssText = 'text-align:left;padding:10px;border-bottom:2px solid #ddd';
    head.appendChild(th);
  }

  table.appendChild(head);

  let lessonsTotal = 0;
  let unitsTotal = 0;
  let supplementalTotal = 0;
  let errors = 0;

  for (const [name,id] of inventoryPrograms) {
    const base = '../programs/' + id + '/data/course/';

    try {
      const [lr,ur] = await Promise.all([
        fetch(base + 'lessons.json', {cache:'no-store'}),
        fetch(base + 'units.json', {cache:'no-store'})
      ]);

      if (!lr.ok || !ur.ok) {
        throw new Error('Curriculum file unavailable');
      }

      const lessonsData = await lr.json();
      const unitsData = await ur.json();

      if (!Array.isArray(lessonsData.lessons) ||
          !Array.isArray(unitsData.units)) {
        throw new Error('Unexpected curriculum structure');
      }

      const lessons = lessonsData.lessons.length;
      const units = unitsData.units.length;
      const supplemental =
        Array.isArray(lessonsData.supplementalSessions)
        ? lessonsData.supplementalSessions.length : 0;

      lessonsTotal += lessons;
      unitsTotal += units;
      supplementalTotal += supplemental;

      const row = document.createElement('tr');

      for (const value of [name,lessons,units,supplemental]) {
        const cell = document.createElement('td');
        cell.textContent = value;
        cell.style.cssText = 'padding:10px;border-bottom:1px solid #eee';
        row.appendChild(cell);
      }

      table.appendChild(row);

    } catch (error) {
      errors++;
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 4;
      cell.textContent = name + ': ' + error.message;
      cell.className = 'health-error';
      row.appendChild(cell);
      table.appendChild(row);
    }
  }

  output.replaceChildren(table);

  const summary = document.createElement('p');
  summary.style.fontWeight = 'bold';
  summary.textContent =
    lessonsTotal + ' lessons · ' +
    unitsTotal + ' units · ' +
    supplementalTotal + ' supplemental sessions' +
    (errors ? ' · ' + errors + ' program(s) could not be counted' : '');

  output.appendChild(summary);

  // Ṣaṭ Sandarbhas: read live anuccheda counts from course.json.
  const sandarbhaInventory = [
    ['Tattva Sandarbha', 'tattva'],
    ['Bhagavat Sandarbha', 'bhagavat'],
    ['Paramātma Sandarbha', 'paramatma'],
    ['Kṛṣṇa Sandarbha', 'krsna'],
    ['Bhakti Sandarbha', 'bhakti'],
    ['Prīti Sandarbha', 'priti']
  ];

  const heading = document.createElement('h3');
  heading.textContent = 'Ṣaṭ Sandarbhas — Anuccheda Inventory';
  output.appendChild(heading);

  const sandarbhaTable = document.createElement('table');
  sandarbhaTable.style.cssText =
    'width:100%;border-collapse:collapse;margin-top:12px';

  const headerRow = document.createElement('tr');

  for (const label of ['Sandarbha', 'Anucchedas']) {
    const th = document.createElement('th');
    th.textContent = label;
    th.style.cssText =
      'text-align:left;padding:10px;border-bottom:2px solid #ddd';
    headerRow.appendChild(th);
  }

  sandarbhaTable.appendChild(headerRow);

  let sandarbhaTotal = 0;
  let sandarbhaErrors = 0;

  for (const [name, id] of sandarbhaInventory) {
    const row = document.createElement('tr');
    const nameCell = document.createElement('td');
    const countCell = document.createElement('td');

    nameCell.textContent = name;

    try {
      const response = await fetch(
        '../programs/sat-sandarbhas/' + id + '/course.json',
        {cache: 'no-store'}
      );

      if (!response.ok) {
        throw new Error('File unavailable');
      }

      const data = await response.json();

      if (!Array.isArray(data.units)) {
        throw new Error('Invalid units structure');
      }

      const count = data.units.length;
      sandarbhaTotal += count;
      countCell.textContent = String(count);

    } catch (error) {
      sandarbhaErrors++;
      countCell.textContent = 'Error: ' + error.message;
    }

    for (const cell of [nameCell, countCell]) {
      cell.style.cssText =
        'padding:10px;border-bottom:1px solid #eee';
      row.appendChild(cell);
    }

    sandarbhaTable.appendChild(row);
  }

  output.appendChild(sandarbhaTable);

  const sandarbhaSummary = document.createElement('p');
  sandarbhaSummary.style.fontWeight = 'bold';
  sandarbhaSummary.textContent =
    sandarbhaTotal + ' registered anucchedas across ' +
    (sandarbhaInventory.length - sandarbhaErrors) +
    ' of 6 Sandarbhas' +
    (sandarbhaErrors
      ? ' · ' + sandarbhaErrors + ' file(s) could not be counted'
      : '');

  output.appendChild(sandarbhaSummary);

  // Question Bank inventory: count entries in registered question sheets.
  const questionHeading = document.createElement('h3');
  questionHeading.textContent = 'Question Bank Inventory';
  output.appendChild(questionHeading);

  const questionInfo = document.createElement('p');
  questionInfo.textContent =
    'Registered question entries, not deduplicated across providers.';
  output.appendChild(questionInfo);

  const questionTable = document.createElement('table');
  questionTable.style.cssText =
    'width:100%;border-collapse:collapse;margin-top:12px';

  const questionHeader = document.createElement('tr');

  for (const label of ['Academic Program', 'Sheets', 'Questions']) {
    const th = document.createElement('th');
    th.textContent = label;
    th.style.cssText =
      'text-align:left;padding:10px;border-bottom:2px solid #ddd';
    questionHeader.appendChild(th);
  }

  questionTable.appendChild(questionHeader);

  const questionTotals = new Map();
  let questionSheetInventory = 0;
  let questionErrors = 0;
  let registeredSheetCount = 0;

  try {
    const registryResponse = await fetch(
      '../data/question-sheet-registry.json',
      {cache:'no-store'}
    );

    if (!registryResponse.ok) {
      throw new Error('Question registry unavailable');
    }

    const registry = await registryResponse.json();

    if (!Array.isArray(registry.sheets)) {
      throw new Error('Invalid question registry');
    }

    registeredSheetCount = registry.sheets.length;

    for (const sheet of registry.sheets) {
      try {
        if (typeof sheet.data !== 'string' ||
            !sheet.data.startsWith('programs/') ||
            sheet.data.includes('..')) {
          throw new Error('Invalid question file path');
        }

        const response = await fetch(
          '../' + sheet.data,
          {cache:'no-store'}
        );

        if (!response.ok) {
          throw new Error('Question file unavailable');
        }

        const data = await response.json();
        let count = 0;

        if (Array.isArray(data.questions)) {
          count = data.questions.length;
        } else if (Array.isArray(data.groups)) {
          for (const group of data.groups) {
            if (!Array.isArray(group.sections)) {
              throw new Error('Invalid group sections');
            }

            for (const section of group.sections) {
              if (!Array.isArray(section.questions)) {
                throw new Error('Invalid section questions');
              }
              count += section.questions.length;
            }
          }
        } else {
          throw new Error('Unknown question structure');
        }

        const program = sheet.program || 'Unassigned';

        if (!questionTotals.has(program)) {
          questionTotals.set(program, {sheets:0, questions:0});
        }

        const item = questionTotals.get(program);
        item.sheets++;
        item.questions += count;
        questionSheetInventory += count;

      } catch (error) {
        questionErrors++;
        console.warn('Question inventory:', sheet.id, error);
      }
    }

    const programNames = {
      'bhakti-sastri': 'Bhakti Śāstrī',
      'bhakti-vaibhava': 'Bhakti Vaibhava',
      'bhakti-vedanta': 'Bhakti Vedānta',
      'bhakti-sarvabhauma': 'Bhakti Sārvabhauma'
    };

    for (const [program, item] of questionTotals) {
      const row = document.createElement('tr');

      for (const value of [
        programNames[program] || program,
        item.sheets,
        item.questions
      ]) {
        const cell = document.createElement('td');
        cell.textContent = String(value);
        cell.style.cssText =
          'padding:10px;border-bottom:1px solid #eee';
        row.appendChild(cell);
      }

      questionTable.appendChild(row);
    }

    output.appendChild(questionTable);

    const questionSummary = document.createElement('p');
    questionSummary.style.fontWeight = 'bold';
    questionSummary.textContent =
      questionSheetInventory + ' question entries · ' +
      registeredSheetCount + ' registered sheets' +
      (questionErrors
        ? ' · ' + questionErrors + ' sheet(s) could not be counted'
        : '');

    output.appendChild(questionSummary);

  } catch (error) {
    const message = document.createElement('p');
    message.textContent = 'Question inventory error: ' + error.message;
    output.appendChild(message);
  }


  // LIBRARY_CONTENT_INVENTORY_V1
  try {
    const libraryResponse = await fetch('../data/books.json');

    if (!libraryResponse.ok) {
      throw new Error('Cannot load Library Registry');
    }

    const libraryRegistry = await libraryResponse.json();

    if (!Array.isArray(libraryRegistry)) {
      throw new Error('Unexpected Library Registry structure');
    }

    const libraryHeading = document.createElement('h3');
    libraryHeading.textContent = 'Library Content Inventory';
    output.appendChild(libraryHeading);

    const libraryTable = document.createElement('table');
    libraryTable.style.cssText =
      'width:100%;border-collapse:collapse;margin-top:12px';

    const libraryHeader = document.createElement('tr');

    for (const heading of [
      'Book', 'Status', 'Sections',
      'Registered Records', 'Actual Records', 'Verification'
    ]) {
      const cell = document.createElement('th');
      cell.textContent = heading;
      cell.style.cssText =
        'padding:10px;text-align:left;border-bottom:2px solid #aaa';
      libraryHeader.appendChild(cell);
    }

    libraryTable.appendChild(libraryHeader);

    let importedBooks = 0;
    let actualLibraryRecords = 0;
    let registeredLibraryRecords = 0;
    let libraryMismatches = 0;
    let libraryErrors = 0;
    let libraryModules = 0;

    for (const book of libraryRegistry) {
      const row = document.createElement('tr');

      let actualSections = '—';
      let actualRecords = '—';
      let verification = 'Not checked';

      const status = book.status || 'unknown';

      try {
        if (
          typeof book.dataPath !== 'string' ||
          !(
            book.dataPath.startsWith('library/') ||
            (
              book.id === 'sat-sandarbhas' &&
              book.dataPath === 'sandarbhas/module.json'
            )
          ) ||
          book.dataPath.split('/').includes('..')
        ) {
          throw new Error('Invalid source path');
        }

        const response = await fetch('../' + book.dataPath);

        if (!response.ok) {
          throw new Error('Source unavailable: HTTP ' + response.status);
        }

        const source = await response.json();

        if (status === 'imported') {
          importedBooks++;

          if (!Array.isArray(source.sections)) {
            throw new Error('Missing sections array');
          }

          actualSections = source.sections.length;
          actualRecords = 0;

          for (const section of source.sections) {
            if (!Array.isArray(section.verses)) {
              throw new Error('Invalid verses array');
            }
            actualRecords += section.verses.length;
          }

          actualLibraryRecords += actualRecords;

          const declaredRecords = Number(book.records);
          const declaredSections = Number(book.sections);

          if (Number.isFinite(declaredRecords)) {
            registeredLibraryRecords += declaredRecords;
          }

          if (
            actualRecords !== declaredRecords ||
            actualSections !== declaredSections
          ) {
            libraryMismatches++;
            verification = 'Metadata mismatch';
          } else {
            verification = 'Match';
          }

        } else {
          libraryModules++;
          verification = 'Module source available';
        }

      } catch (error) {
        libraryErrors++;
        verification = 'Error: ' + error.message;
      }

      for (const value of [
        book.title || 'Untitled',
        status,
        status === 'imported'
          ? String(book.sections ?? '—') + ' / ' + actualSections
          : '—',
        status === 'imported' ? book.records ?? '—' : '—',
        actualRecords,
        verification
      ]) {
        const cell = document.createElement('td');
        cell.textContent = String(value);
        cell.style.cssText =
          'padding:10px;border-bottom:1px solid #eee';
        row.appendChild(cell);
      }

      libraryTable.appendChild(row);
    }

    output.appendChild(libraryTable);

    const librarySummary = document.createElement('p');
    librarySummary.style.fontWeight = 'bold';
    librarySummary.textContent =
      libraryRegistry.length + ' registry entries · ' +
      importedBooks + ' imported books · ' +
      libraryModules + ' module(s) · ' +
      actualLibraryRecords.toLocaleString() + ' actual reading records · ' +
      registeredLibraryRecords.toLocaleString() + ' registered records · ' +
      libraryMismatches + ' metadata mismatch(es) · ' +
      libraryErrors + ' error(s)';

    output.appendChild(librarySummary);

  } catch (error) {
    const message = document.createElement('p');
    message.textContent = 'Library inventory error: ' + error.message;
    output.appendChild(message);
  }

  button.disabled = false;
});

</script>
</body>
</html>
