<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Śloka Lab</title><link rel="stylesheet" href="../shared/styles.css"><style>.sloka-text{font-size:1.18rem;line-height:1.8;white-space:pre-line}.lab-card{max-width:850px}.source-pill{display:inline-block;background:#e6fffb;color:#075e54;border-radius:999px;padding:5px 9px;font:700 12px Arial}</style></head><body><div class="layout"><aside class="sidebar"></aside><main class="main"><div class="eyebrow">Shared memorization tool</div><h1>Śrīla Prabhupāda Ślokas</h1><p class="lead">Bhakti Study sends only the normalized reference. Verse and audio data are loaded from the separate Śloka project when available.</p><div id="box" class="card lab-card"><p>Loading Śloka Lab…</p></div></main></div><script src="../shared/app.js"></script><script>
sidebar('slokas');
const repo='https://raw.githubusercontent.com/Codecmb/srila-prabhupada-slokas/main/';
const repoPage='https://github.com/Codecmb/srila-prabhupada-slokas';
const q=new URLSearchParams(location.search),wanted=(q.get('ref')||'').trim();
const norm=s=>String(s||'').toUpperCase().replace(/[ŚĪĀṚṆṂḤṢṬḌṄÑ]/g,c=>c).replace(/[^A-Z0-9]/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const [verses,audio]=await Promise.all([fetch(repo+'verses.json').then(r=>{if(!r.ok)throw Error('verse data');return r.json()}),fetch(repo+'audio-map.json').then(r=>r.ok?r.json():{})]);const arr=Array.isArray(verses)?verses:(verses.verses||Object.values(verses));let v=wanted?arr.find(x=>[x.reference,x.id,x.source].some(z=>norm(z)===norm(wanted))):null;if(!wanted){box.innerHTML=`<h2>Choose a required śloka from a course</h2><p>Open Bhakti Śāstrī and select a śloka pill such as BG 2.13.</p><p><a class="button" href="../programs/bhakti-sastri/index.html">Bhakti Śāstrī</a></p>`;return}if(!v){box.innerHTML=`<span class="source-pill">Live provider</span><h2>${esc(wanted)}</h2><p>This reference was not found in the current Śloka repository dataset.</p><p><a class="button secondary" href="${repoPage}" target="_blank" rel="noopener">Open Śloka Repository</a></p>`;return}const ref=v.reference||v.id||wanted;let audioVal=audio[ref]||audio[v.id]||v.audio||'';if(audioVal&&typeof audioVal==='object')audioVal=audioVal.url||audioVal.src||'';if(audioVal&& !/^https?:/.test(audioVal))audioVal=repo+audioVal.replace(/^\.\//,'');box.innerHTML=`<span class="source-pill">Live from Śloka project</span><h2>${esc(ref)}</h2>${v.title?`<h3>${esc(v.title)}</h3>`:''}${v.verse?`<div class="sloka-text">${esc(v.verse)}</div>`:''}${v.word_for_word?`<h3>Word-for-word</h3><p>${esc(v.word_for_word)}</p>`:''}${v.translation?`<h3>Translation</h3><p>${esc(v.translation)}</p>`:''}${audioVal?`<h3>Audio</h3><audio controls src="${esc(audioVal)}"></audio>`:''}<div class="action-grid"><a class="button" href="../library/reader.html?book=bg&ref=${encodeURIComponent(ref)}">Read in Primary Book</a><a class="button secondary" href="${repoPage}" target="_blank" rel="noopener">Śloka Project</a></div>`}catch(e){box.innerHTML=`<h2>${esc(wanted||'Śloka Lab')}</h2><div class="notice">The live Śloka dataset could not be loaded. Your course reference is preserved; check the network connection or open the separate project.</div><a class="button secondary" href="${repoPage}" target="_blank" rel="noopener">Open Śloka Repository</a>`}})();
</script></body></html>
