<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Classroom | Bhakti Study</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f5f3ee;
    color: #242424;
  }
  header {
    padding: 16px 24px;
    background: #fff;
    border-bottom: 1px solid #ddd;
  }
  h1 { margin: 0; font-size: 22px; }
  .toolbar { padding: 14px 24px; }
  select {
    padding: 10px;
    font-size: 15px;
    max-width: 100%;
  }
  .classroom {
    display: grid;
    grid-template-columns: 35% 65%;
    height: calc(100vh - 125px);
  }
  .video-panel {
    padding: 12px;
    overflow-y: auto;
  }
  .video-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    background: #111;
  }
  details {
    margin-top: 14px;
    padding: 12px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
  }
  summary { cursor: pointer; font-weight: 600; }
  .lesson {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    text-align: left;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  .lesson:hover { background: #eee; }
  .journal-frame {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
  }
  @media(max-width: 800px) {
    .classroom {
      display: block;
      height: auto;
    }
    .journal-frame { height: 75vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Study Classroom</h1>
</header>

<div class="toolbar">
  <label for="program">Study Program: </label>
  <select id="program">
    <option value="bs">Bhakti Shastri</option>
    <option value="bv">Bhakti Vaibhava</option>
    <option value="bved">Bhakti Vedanta</option>
    <option value="bsarv">Bhakti Sarvabhauma</option>
    <option value="sandarbhas">Sat Sandarbhas</option>
  </select>
</div>

<main class="classroom">
  <section class="video-panel">
    <iframe
      id="video"
      class="video-frame"
      title="Class video"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>

    <details id="lessonCatalog">
      <summary>Select a Class</summary>
      <div id="lessonList"></div>
    </details>
  </section>

  <iframe
    id="journal"
    class="journal-frame"
    title="Study Journal"
    src="journal.html?aula=1">
  </iframe>
</main>

<script src="classroom-lessons.js"></script>
<script>
const lessons = classroomLessons;

const program = document.getElementById("program");
const video = document.getElementById("video");
const journal = document.getElementById("journal");
const lessonList = document.getElementById("lessonList");

function selectLesson(lesson) {
  video.src = "https://www.youtube.com/embed/" +
    encodeURIComponent(lesson.id);

  const params = new URLSearchParams({
    aula: "1",
    program: program.value,
    book: "youtube",
    bookTitle: "Video Classes",
    section: lesson.title,
    ref: "youtube:" + lesson.id
  });

  journal.src = "journal.html?" + params.toString();
}

function showLessons() {
  lessonList.replaceChildren();
  video.removeAttribute("src");

  const items = lessons[program.value] || [];

  if (!items.length) {
    lessonList.textContent =
      "Classes for this program are being prepared.";
    journal.src = "journal.html?aula=1";
    return;
  }

  items.forEach(lesson => {
    const button = document.createElement("button");
    button.className = "lesson";
    button.textContent = lesson.title;
    button.onclick = () => selectLesson(lesson);
    lessonList.appendChild(button);
  });

  selectLesson(items[0]);
}

program.addEventListener("change", showLessons);
showLessons();
</script>

</body>
</html>
